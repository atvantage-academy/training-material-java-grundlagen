<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;box-sizing:border-box">
<div style="border-radius:5px;overflow:hidden;border:1px solid #eee"><div style="height:72px;background:var(--avd-anthracite)"></div><div style="padding:7px 10px;font-size:12px"><b>Anthrazit</b><br>#343E3F · Text</div></div>
<div style="border-radius:5px;overflow:hidden;border:1px solid #eee"><div style="height:72px;background:var(--avd-ink)"></div><div style="padding:7px 10px;font-size:12px"><b>Fast-Schwarz</b><br>#1A2627 · Headlines</div></div>
<div style="border-radius:5px;overflow:hidden;border:1px solid #eee"><div style="height:72px;background:var(--avd-slate)"></div><div style="padding:7px 10px;font-size:12px"><b>Blaugrau</b><br>#303E4F · Akzent</div></div>
<div style="border-radius:5px;overflow:hidden;border:1px solid #eee"><div style="height:72px;background:var(--avd-orange)"></div><div style="padding:7px 10px;font-size:12px"><b>Orange</b><br>#FF5401 · Links, Icons</div></div>
<div style="border-radius:5px;overflow:hidden;border:1px solid #eee"><div style="height:72px;background:#fff;border-bottom:1px solid #eee"></div><div style="padding:7px 10px;font-size:12px"><b>Weiß</b><br>#FFFFFF · Hintergrund</div></div>
</body></html>
