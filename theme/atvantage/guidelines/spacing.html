<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:18px 24px;box-sizing:border-box;font-size:13px">
<div style="display:grid;grid-template-columns:190px 1fr;gap:8px 16px;align-items:center">
<span>--section-padding-block · 5rem</span><div style="height:14px;width:80px;background:var(--avd-orange);border-radius:2px"></div>
<span>--module-gap-global · 2rem</span><div style="height:14px;width:32px;background:var(--avd-orange);border-radius:2px"></div>
<span>--content-inline-padding · 24px</span><div style="height:14px;width:24px;background:var(--avd-orange);border-radius:2px"></div>
<span>--module-gap · 1rem</span><div style="height:14px;width:16px;background:var(--avd-orange);border-radius:2px"></div>
<span>--topnav-height · 80px</span><div style="height:14px;width:80px;background:var(--avd-slate);border-radius:2px"></div>
</div>
<div style="color:#707173;margin-top:10px">Breakpoints: 576 / 768 / 992 / 1200 / 1440 / 2000 px</div>
</body></html>
