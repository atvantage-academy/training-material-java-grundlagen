<!DOCTYPE html>
<!-- =============================================================================
     ATVANTAGE Seiten-Template (eigenständig, ohne Jekyll)

     (z. B. eine schnell erstellte HTML-Seite). Bindet das ATVANTAGE-Fundament ein
